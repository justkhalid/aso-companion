<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>ASO Companion</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#0e1224;color:#fff;font-family:-apple-system,"SF Pro Text","Segoe UI",sans-serif;overflow:hidden;user-select:none}
  .box{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:radial-gradient(circle at 50% 38%,rgba(70,90,200,.30),rgba(14,18,36,0) 62%)}
  img{width:104px;height:104px;animation:breathe 2.8s ease-in-out infinite}
  h1{margin:6px 0 0;font-size:17px;font-weight:600;letter-spacing:.2px}
  p{margin:0;font-size:12px;color:#96a0be}
  .bar{margin-top:14px;width:200px;height:5px;border-radius:5px;background:rgba(255,255,255,.16);overflow:hidden;position:relative}
  .bar i{position:absolute;top:0;bottom:0;width:38%;border-radius:5px;background:linear-gradient(90deg,#6e82ff,#96d2ff);animation:slide 1.7s ease-in-out infinite}
  @keyframes breathe{50%{transform:scale(1.045)}}
  @keyframes slide{0%{left:-40%}100%{left:102%}}
</style></head>
<body><div class="box">
  <img src="public/aso-logo.png" alt="">
  <h1>ASO Companion</h1>
  <p>Getting ready...</p>
  <div class="bar"><i></i></div>
</div></body></html>
